
name: Zoomies Android Bionic ARM64 AOT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Zoomies
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install build utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file binutils python3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            -o "$RUNNER_TEMP/android-ndk.zip"

          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"

          NDK="$RUNNER_TEMP/android-ndk-r27c"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$BIN/clang"
          test -x "$BIN/ld.lld"

          echo "$BIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Add Android NativeAOT runtime-pack download
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          project = Path("src/Zoomies.csproj")
          source = project.read_text()

          if "</Project>" not in source:
              raise SystemExit("Cannot find closing Project element.")

          item = """
            <ItemGroup>
              <PackageDownload Include="Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64"
                               Version="[$(BundledNETCoreAppPackageVersion)]" />
            </ItemGroup>
          """

          if "Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64" not in source:
              source = source.replace("</Project>", item + "\n</Project>", 1)
              project.write_text(source)

          print("Configured Android ARM64 NativeAOT runtime-pack download.")
          PY

      - name: Add NativeAOT runtime-pack fallback
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/nativeaot-fallback.targets" <<'XML'
          <Project>
            <Target Name="_ResolveNativeAotSdkAssembliesFallback"
                    AfterTargets="SetupProperties"
                    BeforeTargets="_ComputeAssembliesToCompileToNative"
                    Condition="'$(PublishAot)' == 'true'
                    and '@(PrivateSdkAssemblies)' == ''
                    and '$(RuntimeIdentifier)' != ''">

              <PropertyGroup>
                <_AotPackVersion>$(BundledNETCoreAppPackageVersion)</_AotPackVersion>
                <_AotPackRoot>$(NuGetPackageRoot)microsoft.netcore.app.runtime.nativeaot.$(RuntimeIdentifier)/$(_AotPackVersion)/runtimes/$(RuntimeIdentifier)/</_AotPackRoot>
              </PropertyGroup>

              <PropertyGroup Condition="Exists('$(_AotPackRoot)native')">
                <IlcSdkPath>$(_AotPackRoot)native/</IlcSdkPath>
                <IlcFrameworkNativePath>$(_AotPackRoot)native/</IlcFrameworkNativePath>
                <IlcFrameworkPath>$(_AotPackRoot)lib/net10.0/</IlcFrameworkPath>
              </PropertyGroup>

              <ItemGroup Condition="Exists('$(_AotPackRoot)native')">
                <PrivateSdkAssemblies Include="$(IlcSdkPath)*.dll" />
                <FrameworkAssemblies Include="$(IlcFrameworkPath)**/*.dll" />
                <DefaultFrameworkAssemblies Include="@(FrameworkAssemblies)" />
                <DefaultFrameworkAssemblies Include="@(PrivateSdkAssemblies)" Exclude="@(DefaultFrameworkAssemblies)" />
              </ItemGroup>

              <Message Importance="High"
                       Condition="Exists('$(_AotPackRoot)native')"
                       Text="Resolved NativeAOT runtime pack from $(_AotPackRoot)" />

              <Error Condition="!Exists('$(_AotPackRoot)native')"
                     Text="NativeAOT runtime pack is missing at $(_AotPackRoot). Check PackageDownload and NuGet restore." />
            </Target>
          </Project>
          XML

      - name: Restore Android NativeAOT dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore src/Zoomies.csproj \
            --runtime linux-bionic-arm64 \
            -p:PublishAot=true \
            -p:SelfContained=true

      - name: Verify NativeAOT runtime pack
        shell: bash
        run: |
          set -euo pipefail

          PACK="$HOME/.nuget/packages/microsoft.netcore.app.runtime.nativeaot.linux-bionic-arm64"

          if [ ! -d "$PACK" ]; then
            echo "::error::NativeAOT runtime pack was not restored."
            exit 1
          fi

          find "$PACK" -maxdepth 5 -type d | head -80

          NATIVE_DIR="$(find "$PACK" -type d -path '*/runtimes/linux-bionic-arm64/native' -print -quit)"
          test -n "$NATIVE_DIR"
          test -d "$NATIVE_DIR"

          echo "Found runtime-pack native directory: $NATIVE_DIR"

      - name: Publish NativeAOT ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out

          dotnet publish src/Zoomies.csproj \
            -c Release \
            -f net10.0 \
            -r linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            -o out \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -p:CustomAfterMicrosoftCommonTargets="$RUNNER_TEMP/nativeaot-fallback.targets"

          test -s out/zoomies

      - name: Verify native executable
        shell: bash
        run: |
          set -euo pipefail

          file out/zoomies
          readelf -h out/zoomies | grep -E 'Class:|Machine:'
          readelf -h out/zoomies | grep -q AArch64
          sha256sum out/zoomies

      - name: Upload Zoomies Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: zoomies-android-bionic-arm64
          path: out/zoomies
          if-no-files-found: error
