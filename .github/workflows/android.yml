
name: Zoomies Android Bionic ARM64 AOT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Zoomies
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install build utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file binutils python3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/android-ndk.zip"

          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            --output "$ARCHIVE"

          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"

          NDK="$RUNNER_TEMP/android-ndk-r27c"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Add NativeAOT runtime-pack fallback
        shell: bash
        run: |
          set -euo pipefail

          cat > src/NativeAotFallback.targets <<'XML'
          <Project>
            <Target
              Name="_ResolveNativeAotSdkAssembliesFallback"
              AfterTargets="SetupProperties"
              BeforeTargets="_ComputeAssembliesToCompileToNative"
              Condition="'$(PublishAot)' == 'true'
                and '@(PrivateSdkAssemblies)' == ''
                and '$(RuntimeIdentifier)' != ''">

              <PropertyGroup>
                <_IlcPackageVersion>$([System.IO.Path]::GetFileName($([System.IO.Path]::GetDirectoryName($([System.IO.Path]::GetDirectoryName($(ILCompilerTargetsPath)))))))</_IlcPackageVersion>
                <_NativeAotRuntimePackBase>$(NuGetPackageRoot)microsoft.netcore.app.runtime.nativeaot.$(RuntimeIdentifier)/$(_IlcPackageVersion)/runtimes/$(RuntimeIdentifier)/</_NativeAotRuntimePackBase>
              </PropertyGroup>

              <PropertyGroup Condition="Exists('$(_NativeAotRuntimePackBase)native')">
                <IlcSdkPath>$(_NativeAotRuntimePackBase)native/</IlcSdkPath>
                <IlcFrameworkNativePath>$(_NativeAotRuntimePackBase)native/</IlcFrameworkNativePath>
                <IlcFrameworkPath>$(_NativeAotRuntimePackBase)lib/net10.0/</IlcFrameworkPath>
              </PropertyGroup>

              <ItemGroup Condition="Exists('$(_NativeAotRuntimePackBase)native')">
                <PrivateSdkAssemblies Include="$(IlcSdkPath)*.dll" />
                <FrameworkAssemblies Include="$(IlcFrameworkPath)*.dll" />
                <DefaultFrameworkAssemblies Include="@(FrameworkAssemblies)" />
                <DefaultFrameworkAssemblies Include="@(PrivateSdkAssemblies)" Exclude="@(DefaultFrameworkAssemblies)" />
              </ItemGroup>

              <Message
                Importance="High"
                Condition="Exists('$(_NativeAotRuntimePackBase)native')"
                Text="NativeAOT fallback: resolved SDK assemblies from $(_NativeAotRuntimePackBase)" />

              <Error
                Condition="!Exists('$(_NativeAotRuntimePackBase)native')"
                Text="NativeAOT fallback failed: runtime pack not found at $(_NativeAotRuntimePackBase). Check the restored runtime pack version and path." />
            </Target>
          </Project>
          XML

          python3 <<'PY'
          from pathlib import Path

          path = Path("src/Zoomies.csproj")
          source = path.read_text()
          import_line = '  <Import Project="NativeAotFallback.targets" />'

          if 'NativeAotFallback.targets' not in source:
              if '</Project>' not in source:
                  raise SystemExit("ERROR: Missing closing Project element.")
              source = source.rsplit('</Project>', 1)[0]
              source += import_line + '\n</Project>\n'
              path.write_text(source)

          print("NativeAOT fallback imported into Zoomies.csproj")
          PY

      - name: Restore Android NativeAOT dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore src/Zoomies.csproj \
            --runtime linux-bionic-arm64

      - name: Publish Android ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out

          dotnet publish src/Zoomies.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            --output out \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -p:SysRoot="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          test -s out/zoomies

      - name: Verify native executable
        shell: bash
        run: |
          set -euo pipefail

          file out/zoomies

          readelf -h out/zoomies | grep -E 'Class:|Machine:'
          readelf -h out/zoomies | grep -q AArch64

          echo "ELF interpreter:"
          readelf -l out/zoomies \
            | grep 'Requesting program interpreter' || true

          echo "Dynamic dependencies:"
          readelf -d out/zoomies | grep NEEDED || true

          sha256sum out/zoomies

      - name: Upload Zoomies Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: zoomies-android-bionic-arm64
          path: out/zoomies
          if-no-files-found: error
