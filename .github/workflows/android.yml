
name: Zoomies Android Bionic ARM64 AOT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Zoomies
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install build utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file binutils

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"

          curl --fail --location --retry 3 \
            "$NDK_URL" -o "$NDK_ARCHIVE"

          unzip -q "$NDK_ARCHIVE" -d "$RUNNER_TEMP"

          NDK_ROOT="$RUNNER_TEMP/android-ndk-r27c"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/clang"
          test -x "$NDK_BIN/ld.lld"

          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f src/Zoomies.csproj
          dotnet --info
          grep -n 'TargetFramework' src/Zoomies.csproj || true

      - name: Add NativeAOT runtime-pack fallback
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github/workflows

          cat > .github/workflows/nativeaot-fallback.targets <<'XML'
          <Project>
            <Target Name="_ResolveNativeAotSdkAssembliesFallback"
                    AfterTargets="SetupProperties"
                    BeforeTargets="_ComputeAssembliesToCompileToNative"
                    Condition="'$(PublishAot)' == 'true'
                    and '@(PrivateSdkAssemblies)' == ''
                    and '$(RuntimeIdentifier)' != ''">

              <PropertyGroup>
                <_IlcPackageVersion>$([System.IO.Path]::GetFileName($([System.IO.Path]::GetDirectoryName($([System.IO.Path]::GetDirectoryName($(ILCompilerTargetsPath)))))))</_IlcPackageVersion>
                <_NativeAotRuntimePackBase>$(NuGetPackageRoot)microsoft.netcore.app.runtime.nativeaot.$(RuntimeIdentifier)$([System.IO.Path]::DirectorySeparatorChar)$(_IlcPackageVersion)$([System.IO.Path]::DirectorySeparatorChar)runtimes$([System.IO.Path]::DirectorySeparatorChar)$(RuntimeIdentifier)$([System.IO.Path]::DirectorySeparatorChar)</_NativeAotRuntimePackBase>
              </PropertyGroup>

              <PropertyGroup Condition="Exists('$(_NativeAotRuntimePackBase)native')">
                <IlcSdkPath>$(_NativeAotRuntimePackBase)native$([System.IO.Path]::DirectorySeparatorChar)</IlcSdkPath>
                <IlcFrameworkNativePath>$(_NativeAotRuntimePackBase)native$([System.IO.Path]::DirectorySeparatorChar)</IlcFrameworkNativePath>
                <IlcFrameworkPath>$(_NativeAotRuntimePackBase)lib$([System.IO.Path]::DirectorySeparatorChar)net10.0$([System.IO.Path]::DirectorySeparatorChar)</IlcFrameworkPath>
              </PropertyGroup>

              <ItemGroup Condition="Exists('$(_NativeAotRuntimePackBase)native')">
                <PrivateSdkAssemblies Include="$(IlcSdkPath)*.dll" />
                <FrameworkAssemblies Include="$(IlcFrameworkPath)*.dll" />
                <DefaultFrameworkAssemblies Include="@(FrameworkAssemblies)" />
                <DefaultFrameworkAssemblies Include="@(PrivateSdkAssemblies)" Exclude="@(DefaultFrameworkAssemblies)" />
              </ItemGroup>

              <Message Importance="High"
                       Condition="Exists('$(_NativeAotRuntimePackBase)native')"
                       Text="NativeAOT fallback: resolved assemblies from $(_NativeAotRuntimePackBase)" />

              <Warning Condition="!Exists('$(_NativeAotRuntimePackBase)native')"
                       Text="NativeAOT fallback: runtime pack not found at $(_NativeAotRuntimePackBase)" />
            </Target>
          </Project>
          XML

      - name: Restore Android NativeAOT dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore src/Zoomies.csproj \
            --runtime linux-bionic-arm64 \
            -p:PublishAot=true \
            -p:SelfContained=true

      - name: Publish NativeAOT ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out

          dotnet publish src/Zoomies.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            --output out \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            -p:InvariantGlobalization=true \
            -p:CustomAfterMicrosoftCommonTargets="$GITHUB_WORKSPACE/.github/workflows/nativeaot-fallback.targets"

          test -s out/zoomies

      - name: Verify native executable
        shell: bash
        run: |
          set -euo pipefail

          file out/zoomies

          readelf -h out/zoomies | grep -E 'Class:|Machine:'
          readelf -h out/zoomies | grep -q AArch64

          echo "Interpreter:"
          readelf -l out/zoomies \
            | grep 'Requesting program interpreter' || true

          echo "Dynamic dependencies:"
          readelf -d out/zoomies | grep NEEDED || true

          echo "SHA-256:"
          sha256sum out/zoomies

      - name: Upload Zoomies Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: zoomies-android-bionic-arm64
          path: out/zoomies
          if-no-files-found: error
