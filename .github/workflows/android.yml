
name: Zoomies Android Bionic ARM64 AOT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Zoomies
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install build utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file binutils

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          URL="https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"

          curl --fail --location --retry 3 \
            "$URL" --output "$ARCHIVE"

          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"

          NDK="$RUNNER_TEMP/android-ndk-r27c"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "NDK installed: $NDK"

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f src/Zoomies.csproj

          grep '<TargetFramework>' src/Zoomies.csproj
          grep '<AssemblyName>' src/Zoomies.csproj

          echo "Checking for custom NativeAOT fallback imports:"
          if grep -n 'NativeAotFallback.targets' src/Zoomies.csproj; then
            echo "ERROR: Remove the custom fallback import from the project."
            exit 1
          fi

      - name: Restore NativeAOT dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore src/Zoomies.csproj \
            --runtime linux-bionic-arm64

      - name: Publish NativeAOT ARM64
        shell: bash
        run: |
          set -uo pipefail

          rm -rf out

          dotnet publish src/Zoomies.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            --output out \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -v:normal

          publish_status=$?

          echo "Publish exit code: $publish_status"
          echo "Publish output directory:"
          if [ -d out ]; then
            find out -maxdepth 2 -type f -exec ls -lh {} \;
          else
            echo "out/ was not created."
          fi

          echo "Runtime-specific build output:"
          BUILD_DIR="src/bin/Release/net10.0/linux-bionic-arm64"
          if [ -d "$BUILD_DIR" ]; then
            find "$BUILD_DIR" -maxdepth 3 -type f -exec ls -lh {} \;
          else
            echo "$BUILD_DIR does not exist."
          fi

          if [ "$publish_status" -ne 0 ]; then
            exit "$publish_status"
          fi

          if [ ! -s out/zoomies ]; then
            echo "::error::Native executable out/zoomies was not produced."
            echo "Inspect the publish and runtime-specific output above."
            exit 1
          fi

      - name: Verify native executable
        shell: bash
        run: |
          set -euo pipefail

          file out/zoomies

          readelf -h out/zoomies | grep -E 'Class:|Machine:'
          readelf -h out/zoomies | grep -q AArch64

          echo "ELF interpreter:"
          readelf -l out/zoomies \
            | grep 'Requesting program interpreter' || true

          echo "Dynamic dependencies:"
          readelf -d out/zoomies | grep NEEDED || true

          echo "SHA-256:"
          sha256sum out/zoomies

      - name: Upload Zoomies ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: zoomies-android-bionic-arm64
          path: out/zoomies
          if-no-files-found: error
